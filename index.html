```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的投資組合</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft JhengHei",
    sans-serif;
  background: #f5f1eb;
  color: #3f342b;
}

.container {
  width: min(1100px, 94%);
  margin: 30px auto;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
  color: #5a4636;
}

h2 {
  color: #5a4636;
  margin-top: 0;
}

.card {
  background: #fff;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 22px;
  box-shadow: 0 4px 18px rgba(70, 50, 30, 0.08);
}

.account-box {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.account-box label {
  font-weight: bold;
}

input,
select {
  border: 1px solid #d8cec3;
  border-radius: 9px;
  padding: 10px 12px;
  font-size: 15px;
  background: #fff;
  color: #3f342b;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  background: #80664f;
  color: #fff;
}

button:hover {
  opacity: 0.85;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}

.form-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-item label {
  font-size: 13px;
  font-weight: bold;
  color: #76675a;
}

.form-actions {
  display: flex;
  align-items: end;
  gap: 8px;
}

.secondary {
  background: #999;
}

.danger {
  background: #a85b50;
}

.status {
  margin-top: 14px;
  font-size: 14px;
  color: #777;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 22px;
}

.stat-card {
  background: #fff;
  border-radius: 15px;
  padding: 18px;
  box-shadow: 0 4px 18px rgba(70, 50, 30, 0.08);
}

.stat-title {
  color: #8a7b6e;
  font-size: 13px;
  margin-bottom: 8px;
}

.stat-value {
  font-size: 23px;
  font-weight: bold;
  color: #5a4636;
}

.stat-sub {
  margin-top: 4px;
  font-size: 13px;
}

.val-up {
  color: #b34e43 !important;
}

.val-down {
  color: #39805b !important;
}

.holdings-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.stock-card {
  border: 1px solid #e5ddd4;
  border-radius: 15px;
  padding: 18px;
  background: #fffdfb;
}

.stock-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.stock-symbol {
  font-size: 18px;
  font-weight: bold;
  color: #5a4636;
}

.badge {
  display: inline-block;
  background: #eee5dc;
  color: #6d5948;
  padding: 4px 8px;
  border-radius: 7px;
  font-size: 12px;
}

.stock-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  font-size: 14px;
}

.pnl-box {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  padding: 12px;
  margin-top: 5px;
  border-radius: 9px;
  background: #f5f0eb;
  font-weight: bold;
}

.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.btn-sell {
  flex: 1;
}

.btn-del {
  background: #a85b50;
}

.ticker {
  overflow: hidden;
  white-space: nowrap;
  margin-bottom: 20px;
  background: #fff;
  border-radius: 12px;
  padding: 10px;
}

.ticker-track {
  display: inline-flex;
  gap: 30px;
}

.ticker-item {
  font-size: 13px;
}

.realized-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 750px;
}

th,
td {
  padding: 11px 9px;
  border-bottom: 1px solid #eee5dd;
  text-align: center;
  font-size: 13px;
}

th {
  background: #eee5dc;
  color: #5a4636;
}

.delete-realized {
  background: #a85b50;
  padding: 6px 10px;
  font-size: 12px;
}

.empty-message,
.empty-table {
  color: #999;
  text-align: center;
  padding: 25px;
}

@media (max-width: 900px) {
  .form-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .holdings-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  .container {
    width: 94%;
    margin: 15px auto;
  }

  .card {
    padding: 16px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .account-box {
    flex-direction: column;
    align-items: stretch;
  }

  .account-box input,
  .account-box select,
  .account-box button {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>我的投資組合</h1>

<div class="card">
  <div class="account-box">
    <label for="accountInput">帳號</label>

    <input
      id="accountInput"
      type="text"
      value="user1"
      placeholder="輸入帳號"
    >

    <button
      id="switchAccountBtn"
      type="button"
    >
      切換帳號
    </button>

    <button
      id="refreshBtn"
      type="button"
      class="secondary"
    >
      重新整理
    </button>
  </div>
</div>

<div class="stats">

  <div class="stat-card">
    <div class="stat-title">目前持股市值</div>
    <div id="totalMarketValue" class="stat-value">$0</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">未實現損益</div>
    <div id="totalPnl" class="stat-value">$0</div>
    <div id="totalPnlRate" class="stat-sub">0.00%</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">已實現損益</div>
    <div id="totalRealizedPnl" class="stat-value">$0</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">USD / TWD</div>
    <div id="usdTwdRate" class="stat-value">32.250</div>
  </div>

</div>

<div class="ticker">
  <div id="tickerTrack" class="ticker-track">
    <span class="ticker-item">
      尚無持股資料
    </span>
  </div>
</div>

<div class="card">

<h2>新增 / 編輯持股</h2>

<form id="addForm">

<div class="form-grid">

  <div class="form-item">
    <label for="symbol">股票代號</label>
    <input
      id="symbol"
      type="text"
      placeholder="2330"
      required
    >
  </div>

  <div class="form-item">
    <label for="name">股票名稱</label>
    <input
      id="name"
      type="text"
      placeholder="台積電"
    >
  </div>

  <div class="form-item">
    <label for="market">市場</label>

    <select id="market">
      <option value="TW">台股上市</option>
      <option value="TWO">台股上櫃</option>
      <option value="US">美股</option>
    </select>
  </div>

  <div class="form-item">
    <label for="cost">平均成本</label>
    <input
      id="cost"
      type="number"
      min="0"
      step="0.01"
      placeholder="1000"
      required
    >
  </div>

  <div class="form-item">
    <label for="qty">股數</label>
    <input
      id="qty"
      type="number"
      min="0"
      step="1"
      placeholder="1000"
      required
    >
  </div>

</div>

<div class="form-actions" style="margin-top:15px;">

  <button type="submit">
    儲存持股
  </button>

  <button
    type="button"
    id="cancelEditBtn"
    class="secondary"
    style="display:none;"
  >
    取消編輯
  </button>

</div>

</form>

<div id="syncStatus" class="status">
  雲端同步準備完成
</div>

</div>

<div class="card">

<h2>目前持股</h2>

<div
  id="holdingsGrid"
  class="holdings-grid"
>
  <div class="empty-message">
    尚無未實現持股。
  </div>
</div>

</div>

<div class="card">

<h2>已實現損益</h2>

<div class="realized-wrapper">

<table>

<thead>
<tr>
  <th>日期</th>
  <th>股票</th>
  <th>市場</th>
  <th>買入成本</th>
  <th>賣出價格</th>
  <th>股數</th>
  <th>原幣損益</th>
  <th>台幣損益</th>
  <th>操作</th>
</tr>
</thead>

<tbody id="realizedTableBody">

<tr>
  <td colspan="9" class="empty-table">
    尚無已實現賣出紀錄
  </td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

<script src="app.js?v=20261008"></script>

</body>
</html>
```
