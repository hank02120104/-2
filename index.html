<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人全資產投資組合 Dashboard</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --border: #232d42;
      --text: #f1f5f9;
      --muted: #64748b;
      --red: #ff4d4d;
      --green: #00e676;
      --accent: #00d2ff;
      --orange: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      padding-bottom: 60px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .account-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .account-selector {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }

    .val-down { color: var(--red); }
    .val-up { color: var(--green); }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary:hover { background: #2563eb; }

    .btn-refresh {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    input, select, button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    button.btn-add {
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .section-title { font-size: 20px; margin: 24px 0 16px 0; }

    .holdings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .stock-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .stock-symbol { font-size: 18px; font-weight: bold; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #232d42; }

    .stock-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .pnl-box {
      grid-column: span 2;
      border-top: 1px dashed var(--border);
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-sell {
      flex: 1;
      background: var(--orange);
      color: #000;
      font-weight: bold;
      padding: 6px;
      font-size: 12px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
    }

    .btn-del {
      background: #ef4444;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      border: none;
      color: #fff;
      border-radius: 6px;
    }

    .realized-table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    table.realized-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    table.realized-table th, table.realized-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    table.realized-table th {
      background: #1e293b;
      color: var(--muted);
      font-size: 12px;
    }

    .ticker-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background: #060911;
      border-top: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 100;
    }

    .ticker-track { display: flex; white-space: nowrap; animation: marquee 25s linear infinite; }
    .ticker-item { margin-right: 32px; font-size: 13px; font-family: monospace; }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <!-- 多帳號切換列 -->
  <div class="account-bar">
    <div class="account-selector">
      <span style="font-weight: bold; color: var(--accent);">👤 當前帳號：</span>
      <input type="text" id="accountInput" placeholder="輸入帳號名稱" style="width: 160px;" value="user1">
      <button class="btn-primary" onclick="switchAccount()">切換／載入</button>
    </div>
    <div style="font-size: 13px; color: var(--muted);">
      💡 可以在不同裝置切換相同帳號同步持股與賣出紀錄。
    </div>
  </div>

  <div class="top-grid">
    <div class="stat-card">
      <div class="stat-title">總市值估算 (NT)</div>
      <div class="stat-value" id="totalMarketValue">$0</div>
      <div class="stat-sub">未實現現值</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">未實現總損益</div>
      <div class="stat-value" id="totalPnl">$0</div>
      <div class="stat-sub" id="totalPnlRate">0.00%</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">累計已實現損益 (NT)</div>
      <div class="stat-value" id="totalRealizedPnl">$0</div>
      <div class="stat-sub">已結算獲利/虧損</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">美金匯率 (USD/TWD)</div>
      <div class="stat-value" id="usdTwdRate">--</div>
      <div class="stat-sub">
        <span id="countdownText">60 秒後更新</span>
        <button class="btn-refresh" onclick="manualRefresh()">立即更新</button>
      </div>
    </div>
  </div>

  <div class="form-card">
    <h3 style="font-size: 16px;">新增 / 編輯持股</h3>
    <form id="addForm">
      <div class="form-grid">
        <input type="text" id="symbol" placeholder="代號 (如: 2330, NVDA)" required>
        <input type="text" id="name" placeholder="名稱 (如: 台積電, 輝達)" required>
        <select id="market">
          <option value="TW">台股 (上市 .TW)</option>
          <option value="TWO">台股 (上櫃 .TWO)</option>
          <option value="US">美股 (USD)</option>
        </select>
        <input type="number" id="cost" step="0.01" placeholder="買入成本" required>
        <input type="number" id="qty" step="1" placeholder="持有股數" required>
        <button type="submit" class="btn-add">加入投資組合</button>
      </div>
    </form>
  </div>

  <h2 class="section-title">未實現持股 (<span class="accountTitle">user1</span>)</h2>
  <div class="holdings-grid" id="holdingsGrid"></div>

  <h2 class="section-title">已實現獲利交易紀錄 (<span class="accountTitle">user1</span>)</h2>
  <div class="realized-table-container">
    <table class="realized-table">
      <thead>
        <tr>
          <th>時間</th>
          <th>標的</th>
          <th>市場</th>
          <th>買入成本</th>
          <th>賣出價格</th>
          <th>股數</th>
          <th>已實現損益 (原幣)</th>
          <th>已實現損益 (NT)</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="realizedTableBody"></tbody>
    </table>
  </div>

  <div class="ticker-bar">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <!-- 帶版本號引入腳本，防手機瀏覽器快取 -->
  <script src="app.js?v=2.0.0"></script>
</body>
</html>
